; PaxxTouch – K-Touch / PandaTouch U1 remote screen mirror (+ optional full Moonraker UI)

[platformio]
default_envs = paxxtouch-remote

[env]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags =
  -I include
  -DLV_CONF_INCLUDE_SIMPLE
  -DBOARD_HAS_PSRAM
  -DPAXXTOUCH_VERSION=\"0.1.2\"
  -DCORE_DEBUG_LEVEL=0
  -DPNG_MAX_BUFFERED_PIXELS=((480*4+1)*2)
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
lib_deps =
  lvgl/lvgl@9.3.0
  tamctec/TAMC_GT911@1.0.2
  moononournation/GFX Library for Arduino@1.5.0
  links2004/WebSockets@2.4.1
  bblanchon/ArduinoJson@7.3.0
  bitbank2/PNGdec@1.1.6
  bodmer/TJpg_Decoder@1.1.0

[env:paxxtouch]
board_build.sdkconfig_options =
  CONFIG_ARDUINO_LOOP_STACK_SIZE=16384

; Remote Screen only — no Moonraker UI, boots into fullscreen mirror
[env:paxxtouch-remote]
extends = env:paxxtouch
build_flags =
  ${env.build_flags}
  -DPAXX_REMOTE_ONLY=1

[env:paxxtouch-arduino-3x]
lib_deps =
  lvgl/lvgl@9.3.0
  tamctec/TAMC_GT911@1.0.2
  moononournation/GFX Library for Arduino@1.6.1
  links2004/WebSockets@2.4.1
  bblanchon/ArduinoJson@7.3.0
  bitbank2/PNGdec@1.1.6
  bodmer/TJpg_Decoder@1.1.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.7
  platformio/framework-arduinoespressif32-libs @ https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.0.7.zip
extra_scripts = pre:build_files_exclude.py
custom_build_files_exclude = */Arduino_ESP32LCD8.cpp */Arduino_ESP32QSPI.cpp
